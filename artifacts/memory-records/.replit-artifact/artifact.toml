kind = "mobile"
previewPath = "/memory-records/"
title = "Memory Records"
version = "1.0.0"
id = "artifacts/memory-records"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/memory-records/" ]
localPort = 18985

[services.development]
run = "pnpm --filter @workspace/memory-records run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/memory-records", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/memory-records", "run", "serve" ]

[services.env]
PORT = "18985"
BASE_PATH = "/memory-records/"
